name: Daily Scraper

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run scraper
        run: python app_auto.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORPSI_FTP_HOST: ${{ secrets.FORPSI_FTP_HOST }}
          FORPSI_FTP_USER: ${{ secrets.FORPSI_FTP_USER }}
          FORPSI_FTP_PASS: ${{ secrets.FORPSI_FTP_PASS }}
          FORPSI_FTP_DIR: ${{ secrets.FORPSI_FTP_DIR }}

      - name: Upload Excel
        uses: actions/upload-artifact@v4
        with:
          name: autos
          path: "*.xlsx"
          if-no-files-found: ignore